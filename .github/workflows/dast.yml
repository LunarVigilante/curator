name: "DAST Security Scan"

on:
  deployment_status:

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    # Only run on successful Vercel preview deployments
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.deployment_status.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false
          
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
          if-no-files-found: ignore

      - name: Comment on PR
        if: github.event.deployment_status.environment == 'Preview'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('report_json.json')) {
              const report = JSON.parse(fs.readFileSync('report_json.json', 'utf8'));
              const alerts = report.site?.[0]?.alerts || [];
              const highAlerts = alerts.filter(a => a.riskcode >= 3);
              const medAlerts = alerts.filter(a => a.riskcode === 2);
              
              const body = `## 🔒 OWASP ZAP Security Scan Results
              
              | Severity | Count |
              |----------|-------|
              | High | ${highAlerts.length} |
              | Medium | ${medAlerts.length} |
              | Total | ${alerts.length} |
              
              ${highAlerts.length > 0 ? '⚠️ **High severity issues found!** Review the ZAP report artifact.' : '✅ No high severity issues found.'}
              `;
              
              // Find the PR associated with this deployment
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${context.payload.deployment_status.deployment.ref}`
              });
              
              if (prs.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prs[0].number,
                  body: body
                });
              }
            }
