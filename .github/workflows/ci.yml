name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Note: 'prisma generate' is not needed as we use Drizzle ORM (schema.ts).
      # If we were using Drizzle Introspection, we might run 'npx drizzle-kit push' or 'generate',
      # but for type checking, the static schema file is sufficient.

      - name: Linting
        run: npm run lint

      - name: Type Checking
        run: npm run typecheck

      - name: Build Test
        run: npm run build
        env:
            # Supabase credentials from GitHub Secrets
            NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
